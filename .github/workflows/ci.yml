name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Reutilizado pelo workflow de release para testar o commit publicado
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Conferir se o uv.lock está atualizado
        run: uv lock --check

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (formatação)
        run: uv run ruff format --check --diff .

  tests:
    name: Django ${{ matrix.django }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apenas combinações suportadas oficialmente por cada versão do Django
          - { django: "4.2", python: "3.10" }
          - { django: "4.2", python: "3.12" }
          - { django: "5.2", python: "3.10" }
          - { django: "5.2", python: "3.13" }
          - { django: "6.0", python: "3.12" }
          - { django: "6.0", python: "3.14" }
          - { django: "6.1", python: "3.12" }
          - { django: "6.1", python: "3.14" }

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Instalar dependências
        run: |
          uv sync --locked
          uv pip install "django~=${{ matrix.django }}.0"

      - name: Versões instaladas
        run: uv pip list | grep -iE "^(django|cryptography|pillow) "

      - name: Gerar migrações (dry-run)
        run: uv run --no-sync python -m django makemigrations tests --dry-run
        env:
          DJANGO_SETTINGS_MODULE: tests.settings

      - name: Rodar testes
        run: uv run --no-sync python -W error::DeprecationWarning runtests.py

  build:
    name: Build do pacote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Construir sdist e wheel
        run: uv build

      - name: Validar metadados
        run: uvx twine check --strict dist/*

      - name: Conferir conteúdo do wheel
        run: |
          uv run --no-project python - <<'EOF'
          import glob, sys, zipfile

          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          unexpected = [n for n in names if n.startswith("tests/") or "__pycache__" in n]
          if unexpected:
              sys.exit(f"Arquivos inesperados no wheel: {unexpected}")
          for package in ("sealed_fields/__init__.py", "sealed_fields/serve/__init__.py"):
              if package not in names:
                  sys.exit(f"Arquivo ausente no wheel: {package}")
          print("\n".join(names))
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
